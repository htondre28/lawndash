<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LawnDash - Premium Lawn Care Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #22c55e;
            --primary-hover: #16a34a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --input-bg: #0f172a; /* Dark background for inputs */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 4px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-card {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card .value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-card .label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Operational Notes Box - Fixed Style */
        .notes-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .notes-container label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        textarea {
            width: 100%;
            height: 120px;
            background-color: var(--input-bg); /* Dark slate background */
            color: var(--text-main); /* White text color */
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s ease;
        }

        textarea:focus {
            border-color: var(--primary); /* Glow green when active */
        }

        textarea::placeholder {
            color: #64748b; /* Sleek slate placeholder text */
        }

        /* Button Styling */
        .btn {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 8px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        /* Job Item List */
        .job-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .job-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        .job-details {
            font-size: 0.9rem;
        }

        .job-status {
            background-color: rgba(34, 197, 94, 0.2);
            color: var(--primary);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <header>
            <h1>LawnDash</h1>
            <p>Premium Lawn Care Operations</p>
        </header>

        <!-- Stats Section -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="value">4</div>
                <div class="label">Jobs Today</div>
            </div>
            <div class="stat-card">
                <div class="value">$320</div>
                <div class="label">Est. Revenue</div>
            </div>
        </div>

        <!-- Today's Schedule -->
        <div class="card">
            <h2>📅 Today's Schedule</h2>
            <ul class="job-list">
                <li class="job-item">
                    <div class="job-details">
                        <strong>104 Oak Lane</strong><br>
                        <span style="color: var(--text-muted);">Mow & Edge</span>
                    </div>
                    <span class="job-status">In Progress</span>
                </li>
                <li class="job-item">
                    <div class="job-details">
                        <strong>218 Pinecrest St</strong><br>
                        <span style="color: var(--text-muted);">Mow, Edge & Blow</span>
                    </div>
                    <span class="job-status" style="background-color: rgba(148, 163, 184, 0.2); color: var(--text-muted);">Pending</span>
                </li>
            </ul>
        </div>

        <!-- Operational Notes Card -->
        <div class="card">
            <h2>📝 Operations Center</h2>
            <div class="notes-container">
                <label for="operational-notes">Operational Notes</label>
                <textarea 
                    id="operational-notes" 
                    placeholder="Type crew instructions, gateway codes, equipment issues, or site notes here..."
                ></textarea>
                <button class="btn" onclick="saveNotes()">Save Notes</button>
            </div>
        </div>

    </div>

    <script>
        // Simple local saving functionality so your notes stick around when you refresh!
        window.onload = function() {
            const savedNotes = localStorage.getItem('lawnDashNotes');
            if (savedNotes) {
                document.getElementById('operational-notes').value = savedNotes;
            }
        };

        function saveNotes() {
            const notes = document.getElementById('operational-notes').value;
            localStorage.setItem('lawnDashNotes', notes);
            alert('Notes saved successfully to this device!');
        }
    </script>
</body>
</html>
